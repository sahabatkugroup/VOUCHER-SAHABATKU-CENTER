<style>
:root{--bg:#F1F5FA;--card:#fff;--ink:#0A1B33;--mut:#5B6B82;--line:#E1E8F1;--blue:#0081F5;--navy:#071A33;--ok:#0E9F6E;--bad:#D63A3A;--chip:#E6F2FF;--chipt:#005DB0;--okb:#DDF6EB;--okt:#0A6B4A;--badb:#FBE3E3;--badt:#9B2222;--wb:#FFF0CF;--wt:#7A5110;--sh:0 1px 2px rgba(10,27,51,.05),0 8px 24px rgba(10,27,51,.06);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#061225;--card:#0D1F3C;--ink:#E8EEF8;--mut:#9DB0CC;--line:#1B3157;--chip:#12345F;--chipt:#8CC6FF;--okb:#0F3A2C;--okt:#6EE0B2;--badb:#471B1B;--badt:#FF9D9D;--wb:#46350F;--wt:#FFD98A;--sh:0 8px 24px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#061225;--card:#0D1F3C;--ink:#E8EEF8;--mut:#9DB0CC;--line:#1B3157;--chip:#12345F;--chipt:#8CC6FF;--okb:#0F3A2C;--okt:#6EE0B2;--badb:#471B1B;--badt:#FF9D9D;--wb:#46350F;--wt:#FFD98A;--sh:0 8px 24px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Plus Jakarta Sans",system-ui,sans-serif;overflow-x:hidden}
h2,h3{margin:0;font-weight:800;letter-spacing:-.01em}h3{font-size:16px}p{margin:6px 0}button,input,select,textarea{font:inherit;color:inherit}
.top{background:var(--navy);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:7}
.top img{width:36px;height:36px;border-radius:10px;cursor:pointer}.top b{display:block;font-size:15px;line-height:1.2}.top small{color:#9DB6D8;font-size:12px}.sp{flex:1}
.ib{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:10px;padding:8px 11px;font-size:13px;font-weight:600;cursor:pointer;transition:background .2s}.ib:active{background:rgba(255,255,255,.25)}
.dot{width:9px;height:9px;border-radius:50%;background:#F5A524;display:inline-block;flex:none}.dot.on{background:#2ED39A}
svg.i{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.shell{display:flex;max-width:1180px;margin:0 auto}
.side{width:224px;padding:18px 10px;position:sticky;top:60px;align-self:flex-start}
.side button,.bn button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:11px 13px;border-radius:12px;font-weight:600;color:var(--mut);cursor:pointer;margin-bottom:4px;transition:background .2s,color .2s}
.side button.on{background:var(--blue);color:#fff}
.bn{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.bn button{flex-direction:column;gap:2px;font-size:11px;padding:6px 2px;margin:0;justify-content:center;flex:1}.bn button.on{color:var(--blue)}
main{flex:1;min-width:0;padding:16px 14px 100px;max-width:100%}
@media(max-width:859px){.side{display:none}}@media(min-width:860px){.bn{display:none!important}main{padding:24px 24px 40px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.an .card,.an .stat,.an .hero{animation:up .45s cubic-bezier(.2,.7,.2,1) both}.an>:nth-child(2){animation-delay:.05s}.an>:nth-child(3){animation-delay:.1s}.an>:nth-child(4){animation-delay:.15s}.an>:nth-child(n+5){animation-delay:.2s}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--sh)}.stat b{font-size:26px;display:block;line-height:1.2}.stat span{color:var(--mut);font-size:13px}
label{display:block;font-weight:600;font-size:13px;margin:12px 0 4px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-size:16px;min-width:0}
input[type=checkbox],input[type=radio]{width:20px;height:20px;padding:0;accent-color:var(--blue);flex:none}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:560px){.row{grid-template-columns:1fr}}
.btn{background:linear-gradient(135deg,#0A8CFF,#0066D6);color:#fff;border:0;padding:12px 18px;border-radius:12px;font-weight:800;cursor:pointer;transition:transform .15s,opacity .2s}.btn:active{transform:scale(.97)}
.btn.big{width:100%;padding:20px;font-size:19px;border-radius:18px}.btn.gh{background:transparent;color:var(--blue);border:1px solid var(--blue)}.btn.ok{background:linear-gradient(135deg,#12B981,#0A8A5F)}.btn.dn{background:var(--bad)}.btn.sm{padding:8px 13px;font-size:13px;border-radius:10px;font-weight:600}.btn.gh.dn{background:transparent;color:var(--bad);border-color:var(--bad)}.btn.w{width:100%}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pill{padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--chip);color:var(--chipt);white-space:nowrap}.pill.ok{background:var(--okb);color:var(--okt)}.pill.bad{background:var(--badb);color:var(--badt)}.pill.w{background:var(--wb);color:var(--wt)}
.item{border-top:1px solid var(--line);padding:12px 0}.item:first-of-type{border-top:0}.h{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.mut{color:var(--mut);font-size:13px}.err{color:var(--bad);font-size:13px;min-height:18px}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;border-radius:9px;transition:width .6s}
.cd{width:11px;height:11px;border-radius:50%;display:inline-block;margin-right:6px;flex:none}
.fb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.fb input,.fb select{width:auto;flex:1 1 130px}
.gh2{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:6px 0;cursor:pointer;text-align:left;font-weight:800;font-size:16px}.gh2 .n{margin-left:auto}.gh2 svg{transition:transform .25s}.gh2.o svg{transform:rotate(90deg)}
.bulk{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px 0;position:sticky;top:60px;background:var(--card);z-index:2}
.ck{display:flex;gap:10px;align-items:center;margin:0;font-size:14px}
.ck.r{padding:6px 0}
.chart{display:flex;align-items:flex-end;gap:3px;height:110px}.cb{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}.cb i{width:100%;background:var(--blue);border-radius:4px 4px 0 0;min-height:2px;opacity:.8}.cb.on i{opacity:1;background:var(--ok)}.cb span{font-size:10px;color:var(--mut);height:14px}

.stack{display:grid;gap:12px;max-width:460px;margin:0 auto}
.res{text-align:center;padding:20px 12px;border-radius:18px;margin-bottom:12px}.res.ok{background:var(--okb);color:var(--okt)}.res.bad{background:var(--badb);color:var(--badt)}.res h2{font-size:23px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin:12px 0 4px}.seg button{flex:1;border:0;background:none;padding:10px;border-radius:9px;font-weight:600;color:var(--mut);cursor:pointer;transition:all .2s}.seg button.on{background:var(--blue);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.sw{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}.sw label{margin:0}.sw input{display:none}.sw span{display:block;width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer;transition:transform .15s}.sw input:checked+span{border-color:var(--ink);transform:scale(1.12)}
canvas{max-width:100%;height:auto;border-radius:16px;display:block;margin:0 auto}
.vc{background:repeating-conic-gradient(var(--line) 0 25%,transparent 0 50%) 0 0/16px 16px;border-radius:16px;padding:8px}
dialog{border:0;border-radius:20px;padding:16px;background:var(--card);color:var(--ink);width:min(620px,94vw);max-height:92dvh;overflow:auto}dialog::backdrop{background:rgba(0,0,0,.6)}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 16px;border-radius:12px;z-index:60;max-width:92vw;font-size:14px;box-shadow:var(--sh)}
.hide{display:none!important}
.load{display:grid;place-items:center;height:50vh}.load i{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.scn{position:fixed;inset:0;height:100dvh;background:#000;z-index:50}.scn video{width:100%;height:100%;object-fit:cover}
.frm{position:absolute;left:50%;top:42%;width:68vmin;height:68vmin;max-width:340px;max-height:340px;transform:translate(-50%,-50%);border-radius:24px;box-shadow:0 0 0 100vmax rgba(0,0,0,.58)}
.frm i{position:absolute;width:42px;height:42px;border:5px solid #fff;border-radius:6px}.frm i:nth-child(1){left:-3px;top:-3px;border-right:0;border-bottom:0;border-top-left-radius:24px}.frm i:nth-child(2){right:-3px;top:-3px;border-left:0;border-bottom:0;border-top-right-radius:24px}.frm i:nth-child(3){left:-3px;bottom:-3px;border-right:0;border-top:0;border-bottom-left-radius:24px}.frm i:nth-child(4){right:-3px;bottom:-3px;border-left:0;border-top:0;border-bottom-right-radius:24px}
.ln{position:absolute;left:8%;right:8%;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,#2EA8FF,transparent);animation:ln 2s ease-in-out infinite alternate}@keyframes ln{from{top:8%}to{top:92%}}
.sxb{position:absolute;right:14px;top:calc(env(safe-area-inset-top,0px) + 14px);width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.5);color:#fff;font-size:20px;cursor:pointer}
.tq{position:absolute;left:14px;top:calc(env(safe-area-inset-top,0px) + 14px);height:44px;border-radius:22px;border:0;background:rgba(0,0,0,.5);color:#fff;padding:0 16px;font-weight:600}
.sbot{position:absolute;left:0;right:0;bottom:0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(0,0,0,.85));color:#fff;text-align:center}
.mrow{display:flex;gap:8px;max-width:440px;margin:10px auto 0}.mrow input{background:rgba(255,255,255,.15);border-color:transparent;color:#fff}.mrow input::placeholder{color:#cdd8e8}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#th{width:40px;height:40px;padding:0;display:grid;place-items:center}#th svg{width:20px;height:20px}
.hero{position:relative;overflow:hidden;background:linear-gradient(150deg,#12A0FF 0%,#0057C2 52%,#071A33 100%);color:#fff;border-radius:30px;padding:32px 20px 70px;text-align:center;box-shadow:var(--sh)}
.hero::before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.3),transparent 70%);top:-110px;right:-70px}
.hero::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(46,168,255,.55),transparent 70%);bottom:-100px;left:-60px}
.hero>*{position:relative;z-index:1}.hero img{width:92px;height:92px;border-radius:50%;border:3px solid rgba(255,255,255,.6);box-shadow:0 0 0 9px rgba(255,255,255,.12),0 12px 30px rgba(0,0,0,.3);margin-bottom:14px}
.hero .tag{display:inline-block;font-size:11px;letter-spacing:.16em;font-weight:800;background:rgba(255,255,255,.18);padding:5px 13px;border-radius:99px;margin-bottom:10px;backdrop-filter:blur(6px)}
.hero h2{font-size:25px}.hero p{color:#D5E8FF;margin:6px 0 0}
.hero+.ov{margin-top:-50px;position:relative}
.pwf{position:relative}.pwf input{padding-right:50px}.eye{position:absolute;right:3px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--mut);padding:11px;cursor:pointer;display:flex}.eye svg{width:20px;height:20px}
.sgb{border:0;cursor:pointer;font-size:12px;font-weight:600;transition:transform .15s}.sgb:active{transform:scale(.95)}
.bn{align-items:flex-end;overflow:visible}
.bn button.fab{flex:none;width:62px;height:62px;border-radius:50%;margin:-28px 8px 0;background:linear-gradient(135deg,#1A95FF,#0057C2);color:#fff;box-shadow:0 10px 24px rgba(0,129,245,.5),0 0 0 6px var(--card);padding:0;justify-content:center;transition:transform .2s}
.bn button.fab span{display:none}.bn button.fab svg{width:28px;height:28px}.bn button.fab:active{transform:scale(.9)}
.bn button.on:not(.fab){color:var(--blue)}.bn button svg{transition:transform .2s}.bn button.on:not(.fab) svg{transform:translateY(-2px)}
main{padding-bottom:112px!important}@media(min-width:860px){main{padding-bottom:40px!important}}.toast{bottom:104px}

/* klaim publik */
function verifyView(t){const v=S.vouchers[t],back=`<button class="btn gh w" style="margin-top:10px" id="bk">Kembali</button>`,bk=()=>{$("#bk").onclick=()=>{location.hash="";render(1)}};
 if(!v){$("#app").innerHTML=`<div class="stack"><div class="res bad"><h2>Tidak ditemukan</h2><p>QR atau kode tidak terdaftar.</p></div>${back}</div>`;return bk()}
 const p=P(v.pid);if(!p){$("#app").innerHTML=`<div class="stack"><div class="res bad"><h2>Tidak ditemukan</h2><p>Program voucher ini sudah dihapus.</p></div>${back}</div>`;return bk()}
 const[k,m]=state(v),[sl]=vst(v),pets=petList().filter(x=>canClaim(x.id,p)),fixed=S.ses&&S.ses.role!=="kurir"?S.ses.name:null;
 $("#app").innerHTML=`<div class="stack" style="max-width:640px"><div class="res ${k}"><h2>${k==="ok"?"Voucher valid":"Tidak dapat diklaim"}</h2><p>${esc(m)}</p></div>
 <div class="card"><div class="vc"><canvas id="cv" width="900" height="420"></canvas></div><h3 style="margin-top:12px">${esc(p.name)}</h3><p><b>${esc(p.benefit)}</b>${p.value?" ("+esc(p.value)+")":""}</p><p class="mut">Kategori: ${esc(p.cat||"-")}<br>Mitra: ${esc(p.partner)}<br>Berlaku: ${valid(p)}<br>Kode: ${v.code}<br>Status: ${sl}<br>Sudah diklaim: ${used(v.pid)} dari ${p.quota}${p.terms?"<br>S&amp;K: "+esc(p.terms):""}</p>
 ${k==="ok"?`<button class="btn big ok" id="kl">KLAIM VOUCHER</button><div id="pwb" class="hide">${fixed?"":pets.length?`<label>Nama petugas</label><select id="pn"><option value="">Pilih nama petugas</option>${pets.map(x=>`<option>${esc(x.username)}</option>`).join("")}</select>`:`<label>Nama petugas</label><input id="pn" autocomplete="off">`}<label>Password klaim</label>${pwi('id="pw" autocomplete="off"')}<p class="err" id="pe"></p><button class="btn w" id="cf2">Konfirmasi klaim</button></div>`:""}</div>${back}</div>`;
 bk();drawV(p,v.code,t,$("#cv"));if(k!=="ok")return;
 $("#kl").onclick=()=>{$("#kl").classList.add("hide");$("#pwb").classList.remove("hide");(fixed?$("#pw"):$("#pn")).focus()};
 $("#cf2").onclick=async()=>{const e=$("#pe"),btn=$("#cf2");e.textContent="";const lm=lockMsg();if(lm)return e.textContent=lm;const by=fixed||($("#pn").value||"").trim();if(!by)return e.textContent="Pilih atau isi nama petugas.";if(!$("#pw").value)return e.textContent="Masukkan password klaim.";
  const L=r=>R("logs").push({t:new Date().toISOString(),d:today(),code:v.code,name:p.name,cat:p.cat||"",pid:v.pid,by,res:r});btn.disabled=true;
  try{if(await sha($("#pw").value)!==p.pwHash){failed();L("PASSWORD SALAH");btn.disabled=false;return e.textContent="Password klaim tidak sesuai. Silakan periksa kembali."}
   const r=await R("vouchers/"+t).transaction(c=>{if(c===null)return c;if(c.status!=="new")return;const pr=P(c.pid);if(!pr||!pr.active||used(c.pid)>=pr.quota)return;return{...c,status:"claimed",claimedAt:new Date().toISOString(),cl:today(),by}});
   if(!r.committed){L("DITOLAK");toast(state(S.vouchers[t]||{})[1]);return verifyView(t)}
   const when=new Date().toISOString();L("BERHASIL");sessionStorage.setItem("fail",0);const n=Math.max(used(v.pid),1);
   $("#app").innerHTML=`<div class="stack" style="max-width:640px"><div class="res ok"><h2>BERHASIL DIKLAIM</h2><p>Sudah diklaim <b>${n} dari ${p.quota}</b> voucher program ini.</p></div><div class="card"><canvas id="pf"></canvas><div class="acts"><button class="btn w" id="dp">Unduh bukti (PNG)</button><button class="btn gh w" id="sc2">Scan voucher lain</button><button class="btn gh w" id="dn">Selesai</button></div></div></div>`;
   drawProof($("#pf"),p,v,by,when,n);$("#dp").onclick=()=>dl($("#pf").toDataURL("image/png"),"bukti-"+v.code+".png");$("#sc2").onclick=()=>{location.hash="";openScan()};$("#dn").onclick=()=>{location.hash="";render(1)}}
  catch(x){btn.disabled=false;e.textContent="Gagal menyimpan klaim: "+x.message+". Voucher tetap pada status sebelumnya."}}}
addEventListener("hashchange",()=>render(1));render();
</script></body></html>
